name: Relatório de bug
description: Informe um comportamento reproduzível do LevelSync
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Não envie projetos, áudio ou dados de terceiros sem autorização.
  - type: input
    id: version
    attributes:
      label: Versão ou commit
      placeholder: v0.5.0 ou hash do commit
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Formato
      options: [VST3, Standalone, Testes, Build]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Windows, DAW, sample rate, buffer, driver e roteamento de sidechain.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Verificações
      options:
        - label: Procurei issues semelhantes.
          required: true
        - label: Posso compartilhar legalmente todo material anexado.
          required: true
