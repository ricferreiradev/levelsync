name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout LevelSync
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout JUCE 9.0.5
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.5
          path: JUCE

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received $tag"
          }
          $version = $Matches[1]
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'project\(LevelSync VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the project version from CMakeLists.txt'
          }
          if ($Matches[1] -ne $version) {
            throw "Tag version $version does not match CMake version $($Matches[1])"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure Release x64
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DJUCE_DIR="${{ github.workspace }}/JUCE"
          -DBUILD_TESTING=ON

      - name: Build binaries and tests
        shell: pwsh
        run: >-
          cmake --build build --config Release
          --target LevelSync_VST3 LevelSync_Standalone
          LevelSyncDSPTests LevelSyncProcessorTests LevelSyncOfflineMetrics
          --parallel 4

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create ZIP packages
        shell: pwsh
        run: |
          ./Packaging/CreateReleasePackages.ps1 `
            -BuildDirectory ./build `
            -OutputDirectory ./release `
            -Version "${{ steps.version.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build VST3 installer
        shell: pwsh
        run: |
          ./Packaging/BuildInnoInstaller.ps1 `
            -BuildDirectory ./build `
            -OutputDirectory ./release `
            -Version "${{ steps.version.outputs.version }}" `
            -RepositoryUrl "https://github.com/${{ github.repository }}"

      - name: Add user manuals
        shell: pwsh
        run: |
          Copy-Item ./output/pdf/LevelSync-User-Manual-EN.pdf ./release/
          Copy-Item ./output/pdf/LevelSync-Manual-do-Usuario-PT-BR.pdf ./release/

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem ./release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content ./release/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"
          $assets = Get-ChildItem ./release -File | ForEach-Object { $_.FullName }
          @"
          ## LevelSync $tag

          LevelSync is an automatic vocal-balance processor for Windows, available as VST3 and Standalone.

          ### What's new in v0.5.1

          - More compact interface with improved use of screen space.
          - Reorganized monitoring and Learn Balance panels.
          - Fixed spacing and clipping in Music Silence Protection controls.
          - English GitHub documentation with English and Brazilian Portuguese user manuals.

          ### Downloads

          - **Standalone ZIP**: run LevelSync without opening a DAW.
          - **VST3 ZIP**: manual plugin installation.
          - **VST3 Setup EXE**: automatic Windows installer.
          - **SHA256SUMS.txt**: download integrity checks.

          ### Documentation

          - [User Manual - English](https://github.com/$repository/releases/download/$tag/LevelSync-User-Manual-EN.pdf)
          - [Manual do Usuário - Português](https://github.com/$repository/releases/download/$tag/LevelSync-Manual-do-Usuario-PT-BR.pdf)

          ### Notes

          - Windows x64 only.
          - The installer is currently unsigned and may trigger a Microsoft Defender SmartScreen warning.
          - Automated tests do not replace validation in every DAW and driver configuration.
          "@ | Set-Content ./release-notes.md -Encoding utf8

          if (gh release view $tag *> $null) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "LevelSync $tag" --notes-file ./release-notes.md
          } else {
            gh release create $tag @assets `
              --verify-tag `
              --title "LevelSync $tag" `
              --notes-file ./release-notes.md
          }
