name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout LevelSync
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout JUCE 9.0.5
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.5
          path: JUCE

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received $tag"
          }
          $version = $Matches[1]
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'project\(LevelSync VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the project version from CMakeLists.txt'
          }
          if ($Matches[1] -ne $version) {
            throw "Tag version $version does not match CMake version $($Matches[1])"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Configure Release x64
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DJUCE_DIR="${{ github.workspace }}/JUCE"
          -DBUILD_TESTING=ON

      - name: Build binaries and tests
        shell: pwsh
        run: >-
          cmake --build build --config Release
          --target LevelSync_VST3 LevelSync_Standalone
          LevelSyncDSPTests LevelSyncProcessorTests LevelSyncOfflineMetrics
          --parallel 4

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Create ZIP packages
        shell: pwsh
        run: |
          ./Packaging/CreateReleasePackages.ps1 `
            -BuildDirectory ./build `
            -OutputDirectory ./release `
            -Version "${{ steps.version.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build VST3 installer
        shell: pwsh
        run: |
          ./Packaging/BuildInnoInstaller.ps1 `
            -BuildDirectory ./build `
            -OutputDirectory ./release `
            -Version "${{ steps.version.outputs.version }}" `
            -RepositoryUrl "https://github.com/${{ github.repository }}"

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem ./release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          } | Set-Content ./release/SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem ./release -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @assets `
            --verify-tag `
            --generate-notes `
            --title "LevelSync ${{ github.ref_name }}"
