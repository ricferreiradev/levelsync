name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout LevelSync
        uses: actions/checkout@v7

      - name: Checkout JUCE 9.0.5
        uses: actions/checkout@v7
        with:
          repository: juce-framework/JUCE
          ref: 9.0.5
          path: JUCE

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DJUCE_DIR="${{ github.workspace }}/JUCE"
          -DBUILD_TESTING=ON

      - name: Build Release
        shell: pwsh
        run: >-
          cmake --build build --config Release
          --target LevelSync_VST3 LevelSync_Standalone
          LevelSyncDSPTests LevelSyncProcessorTests LevelSyncOfflineMetrics
          --parallel 4

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
